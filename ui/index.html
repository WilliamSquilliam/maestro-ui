<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro — Multi-Agent Orchestrator</title>
    <style>
        /* === Reset & Base === */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #bc8cff;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === Header === */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .header .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .header .conn-status {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* === Panel Container === */
        .panels-container {
            flex: 1;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 1px;
            background: var(--border-color);
        }

        /* === Individual Panel === */
        .panel {
            flex: 1;
            min-width: 380px;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        .panel.master-panel {
            min-width: 420px;
            border-right: 2px solid var(--accent-blue);
        }

        /* Panel Header */
        .panel-header {
            background: var(--bg-secondary);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }
        .status-dot.active { background: var(--accent-green); animation: pulse 1.5s infinite; }
        .status-dot.reviewing { background: var(--accent-yellow); animation: pulse 1.5s infinite; }
        .status-dot.error { background: var(--accent-red); }
        .status-dot.idle { background: var(--text-muted); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            flex: 1;
        }
        .panel-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        /* Messages Area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Message Bubbles */
        .message {
            max-width: 95%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background: #1f6feb;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }
        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-style: italic;
            padding: 4px 8px;
        }
        .message.dispatch {
            align-self: center;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: var(--accent-blue);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 16px;
        }
        .message.error {
            align-self: flex-start;
            background: #3d1214;
            color: var(--accent-red);
            border: 1px solid rgba(248, 81, 73, 0.3);
        }
        .message.result {
            align-self: flex-start;
            background: #0f2d1a;
            color: var(--accent-green);
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        /* Node transition badges */
        .node-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .node-badge.orchestrator { background: rgba(188, 140, 255, 0.15); color: var(--accent-purple); }
        .node-badge.foreman { background: rgba(88, 166, 255, 0.15); color: var(--accent-blue); }
        .node-badge.worker { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); }
        .node-badge.reviewer { background: rgba(210, 153, 34, 0.15); color: var(--accent-yellow); }

        /* Tool calls */
        .tool-call {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin: 4px 0;
            font-family: var(--font-mono);
            font-size: 12px;
            overflow: hidden;
        }
        .tool-call-header {
            padding: 6px 10px;
            background: var(--bg-tertiary);
            color: var(--accent-purple);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tool-call-header:hover { background: #2d333b; }
        .tool-call-body {
            padding: 8px 10px;
            color: var(--text-secondary);
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .tool-call-body.expanded { display: block; }

        /* Waiting state */
        .waiting-message {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        /* === Input Area (master panel only) === */
        .input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-family: var(--font-sans);
            font-size: 13px;
            resize: none;
            outline: none;
            min-height: 40px;
            max-height: 120px;
        }
        .input-area textarea:focus {
            border-color: var(--accent-blue);
        }
        .input-area button {
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-end;
        }
        .input-area button:hover { background: #2ea043; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* === Responsive === */
        @media (max-width: 900px) {
            .panels-container {
                flex-direction: column;
                overflow-x: hidden;
                overflow-y: auto;
            }
            .panel {
                min-width: 100%;
                max-width: 100%;
                min-height: 400px;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-color); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Maestro</h1>
        <span class="subtitle">Multi-Agent Orchestrator</span>
        <span class="conn-status" id="connectionStatus">Connecting...</span>
    </div>

    <div class="panels-container" id="panelsContainer">
        <div style="padding: 40px; color: var(--text-muted); text-align: center; width: 100%;">
            Loading worker configuration...
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // --- State ---
        let ws = null;
        let wsReconnectDelay = 3000;
        let workerEventSources = {};
        let autoScrollFlags = {};  // panel-id -> bool

        // --- Utilities ---
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getNodeBadgeClass(nodeName) {
            var n = nodeName.toLowerCase();
            if (n.includes('foreman')) return 'foreman';
            if (n.includes('review')) return 'reviewer';
            if (n.includes('orchestrat')) return 'orchestrator';
            return 'worker';
        }

        function getNodeEmoji(nodeName) {
            var n = nodeName.toLowerCase();
            if (n.includes('foreman')) return '\uD83D\uDD35';
            if (n.includes('review')) return '\uD83D\uDFE1';
            if (n.includes('orchestrat')) return '\uD83E\uDDE0';
            return '\uD83D\uDFE2';
        }

        // --- Auto-scroll helper ---
        function scrollToBottom(panelId) {
            if (!autoScrollFlags[panelId]) return;
            var el = document.getElementById('messages-' + panelId);
            if (el) el.scrollTop = el.scrollHeight;
        }

        // --- Add message to panel ---
        function addMessage(panelId, content, className) {
            var el = document.getElementById('messages-' + panelId);
            if (!el) return;

            // Remove waiting message if present
            var waiting = el.querySelector('.waiting-message');
            if (waiting) waiting.remove();

            var msg = document.createElement('div');
            msg.className = 'message ' + className;
            msg.textContent = content;
            el.appendChild(msg);
            scrollToBottom(panelId);
        }

        function addHtmlMessage(panelId, html, className) {
            var el = document.getElementById('messages-' + panelId);
            if (!el) return;

            var waiting = el.querySelector('.waiting-message');
            if (waiting) waiting.remove();

            var msg = document.createElement('div');
            msg.className = className || '';
            msg.innerHTML = html;
            el.appendChild(msg);
            scrollToBottom(panelId);
        }

        function setStatus(panelId, status) {
            var dot = document.getElementById('status-' + panelId);
            if (dot) {
                dot.className = 'status-dot ' + status;
            }
        }

        function setBadge(panelId, text) {
            var badge = document.getElementById('badge-' + panelId);
            if (badge) badge.textContent = text;
        }

        // --- Initialize ---
        async function init() {
            try {
                var resp = await fetch('/api/workers');
                var data = await resp.json();
                var workers = data.workers || data;
                if (!Array.isArray(workers)) workers = [];

                buildPanels(workers);
                connectMasterWebSocket();
                workers.forEach(function(w) { connectWorkerSSE(w.name); });

                document.getElementById('connectionStatus').textContent =
                    workers.length + ' worker(s) discovered';
            } catch (err) {
                document.getElementById('panelsContainer').innerHTML =
                    '<div style="padding: 40px; color: var(--accent-red); text-align: center; width: 100%;">' +
                    'Failed to load worker configuration: ' + escapeHtml(err.message) + '<br>' +
                    '<small>Make sure the API server is running on this host.</small>' +
                    '</div>';
            }
        }

        // --- Build Panels ---
        function buildPanels(workers) {
            var container = document.getElementById('panelsContainer');
            container.innerHTML = '';

            // Master Orchestrator panel
            container.appendChild(createPanel('master', 'Master Orchestrator', 'orchestrator', true));

            // Worker panels
            workers.forEach(function(w) {
                container.appendChild(createPanel('worker-' + w.name, w.name, w.type, false));
            });
        }

        function createPanel(id, title, type, isMaster) {
            var panel = document.createElement('div');
            panel.className = 'panel' + (isMaster ? ' master-panel' : '');
            panel.id = 'panel-' + id;

            var badgeText = isMaster ? 'orchestrator' : type;

            panel.innerHTML =
                '<div class="panel-header">' +
                    '<div class="status-dot idle" id="status-' + id + '"></div>' +
                    '<div class="panel-title">' + escapeHtml(title) + '</div>' +
                    '<span class="panel-badge" id="badge-' + id + '">' + escapeHtml(badgeText) + '</span>' +
                '</div>' +
                '<div class="messages" id="messages-' + id + '">' +
                    (isMaster
                        ? '<div class="message system">Connected to Master Orchestrator. Type a message to begin.</div>'
                        : '<div class="waiting-message">\u23F3 Waiting for tasks...</div>'
                    ) +
                '</div>' +
                (isMaster
                    ? '<div class="input-area">' +
                        '<textarea id="input-master" placeholder="Type your message..." rows="1"></textarea>' +
                        '<button id="btn-send">Send</button>' +
                      '</div>'
                    : '');

            // Auto-scroll tracking
            autoScrollFlags[id] = true;
            var messagesDiv = panel.querySelector('.messages');
            messagesDiv.addEventListener('scroll', function() {
                var st = messagesDiv.scrollTop;
                var sh = messagesDiv.scrollHeight;
                var ch = messagesDiv.clientHeight;
                autoScrollFlags[id] = (sh - st - ch) < 50;
            });

            return panel;
        }

        // --- Master WebSocket ---
        function connectMasterWebSocket() {
            var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + location.host + '/ws/master');

            ws.onopen = function() {
                setStatus('master', 'idle');
                document.getElementById('connectionStatus').textContent = 'Connected';
                wsReconnectDelay = 3000;
                var btn = document.getElementById('btn-send');
                if (btn) btn.disabled = false;
            };

            ws.onmessage = function(event) {
                var data = JSON.parse(event.data);
                handleMasterEvent(data);
            };

            ws.onclose = function() {
                setStatus('master', 'error');
                document.getElementById('connectionStatus').textContent =
                    'Disconnected \u2014 reconnecting...';
                var btn = document.getElementById('btn-send');
                if (btn) btn.disabled = true;
                setTimeout(connectMasterWebSocket, wsReconnectDelay);
                wsReconnectDelay = Math.min(wsReconnectDelay * 2, 30000);
            };

            ws.onerror = function() {
                setStatus('master', 'error');
                document.getElementById('connectionStatus').textContent = 'Connection error';
            };
        }

        function handleMasterEvent(data) {
            if (data.type === 'node_update') {
                setStatus('master', 'active');
                setBadge('master', data.node || 'working');

                // Show node badge
                var cls = getNodeBadgeClass(data.node);
                var emoji = getNodeEmoji(data.node);
                addHtmlMessage('master',
                    '<span class="node-badge ' + cls + '">' +
                    emoji + ' ' + escapeHtml(data.node) +
                    '</span>', 'node-badge-wrapper');

                // Show dispatch indicator if routing to a worker
                if (data.next_actor && data.next_actor !== 'end') {
                    addMessage('master',
                        '\u2192 Dispatched to ' + data.next_actor, 'dispatch');
                }

                // Show execution plan if present
                if (data.execution_plan) {
                    addMessage('master', data.execution_plan, 'assistant');
                }

                // Show messages if present
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(function(m) {
                        addMessage('master', m, 'assistant');
                    });
                }

            } else if (data.type === 'graph_done') {
                setStatus('master', 'idle');
                setBadge('master', 'ready');
                addMessage('master', '\u2705 Graph execution complete', 'system');
                var btn = document.getElementById('btn-send');
                var input = document.getElementById('input-master');
                if (btn) btn.disabled = false;
                if (input) input.disabled = false;

            } else if (data.type === 'error') {
                setStatus('master', 'error');
                setBadge('master', 'error');
                addMessage('master', '\u274C ' + (data.content || 'Unknown error'), 'error');
                var btn2 = document.getElementById('btn-send');
                var input2 = document.getElementById('input-master');
                if (btn2) btn2.disabled = false;
                if (input2) input2.disabled = false;
            }
        }

        // --- Send message ---
        window.sendMasterMessage = function() {
            var input = document.getElementById('input-master');
            var text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            addMessage('master', text, 'user');
            ws.send(JSON.stringify({ message: text }));
            input.value = '';
            input.style.height = 'auto';

            document.getElementById('btn-send').disabled = true;
            document.getElementById('input-master').disabled = true;
            setStatus('master', 'active');
            setBadge('master', 'working');
        };

        // --- Worker SSE ---
        function connectWorkerSSE(workerName) {
            var panelId = 'worker-' + workerName;

            var es = new EventSource('/api/workers/' + encodeURIComponent(workerName) + '/events');
            workerEventSources[workerName] = es;

            es.onmessage = function(event) {
                var data;
                try {
                    data = JSON.parse(event.data);
                } catch(e) {
                    return;
                }
                handleWorkerEvent(panelId, workerName, data);
            };

            es.onerror = function() {
                setStatus(panelId, 'error');
                setBadge(panelId, 'reconnecting');
                // EventSource auto-reconnects
            };
        }

        function handleWorkerEvent(panelId, workerName, data) {
            switch (data.type) {
                case 'status':
                    var statusMap = {
                        'connected': 'idle',
                        'working': 'active',
                        'idle': 'idle',
                        'complete': 'active',
                        'error': 'error',
                        'reviewing': 'reviewing'
                    };
                    setStatus(panelId, statusMap[data.status] || 'idle');
                    setBadge(panelId, data.status || 'idle');
                    if (data.content) {
                        addMessage(panelId, data.content, 'dispatch');
                    }
                    break;

                case 'heartbeat':
                    // Ignore keepalives
                    break;

                case 'node_update':
                    setStatus(panelId, 'active');
                    var cls = getNodeBadgeClass(data.node);
                    var emoji = getNodeEmoji(data.node);
                    addHtmlMessage(panelId,
                        '<span class="node-badge ' + cls + '">' +
                        emoji + ' ' + escapeHtml(data.node) +
                        '</span>', 'node-badge-wrapper');
                    setBadge(panelId, data.node || 'working');
                    break;

                case 'foreman_instructions':
                    setStatus(panelId, 'active');
                    setBadge(panelId, 'foreman');
                    addMessage(panelId, data.content, 'assistant');
                    break;

                case 'worker_output':
                    setStatus(panelId, 'active');
                    setBadge(panelId, 'working');
                    addMessage(panelId, data.content, 'assistant');
                    break;

                case 'review_notes':
                    setStatus(panelId, 'reviewing');
                    setBadge(panelId, 'reviewing');
                    addMessage(panelId, data.content, 'assistant');
                    break;

                case 'agent_stream':
                case 'agent_thinking':
                    addMessage(panelId, data.content || '', 'assistant');
                    break;

                case 'tool_use':
                    addHtmlMessage(panelId,
                        '<div class="tool-call">' +
                            '<div class="tool-call-header" onclick="this.nextElementSibling.classList.toggle(\'expanded\')">' +
                                '\uD83D\uDD27 ' + escapeHtml(data.tool || 'tool call') +
                                '<span style="margin-left:auto; font-size:10px;">\u25BC</span>' +
                            '</div>' +
                            '<div class="tool-call-body">' +
                                escapeHtml(data.content || JSON.stringify(data.args || {})) +
                            '</div>' +
                        '</div>', '');
                    break;

                case 'routing':
                    addMessage(panelId, '\u2192 Next: ' + data.next_actor, 'dispatch');
                    break;

                case 'result':
                    setStatus(panelId, 'active');
                    setBadge(panelId, 'complete');
                    addMessage(panelId, '\u2705 ' + (data.content || ''), 'result');
                    break;

                case 'done':
                    setStatus(panelId, 'idle');
                    setBadge(panelId, 'done');
                    if (data.text) {
                        var preview = data.text.substring(0, 200);
                        if (data.text.length > 200) preview += '...';
                        addMessage(panelId, '\u2705 Complete: ' + preview, 'result');
                    } else {
                        addMessage(panelId, '\u2705 Task complete', 'system');
                    }
                    break;

                case 'error':
                    setStatus(panelId, 'error');
                    setBadge(panelId, 'error');
                    addMessage(panelId, '\u274C ' + (data.content || 'Error'), 'error');
                    break;
            }
        }

        // --- Auto-resize textarea ---
        document.addEventListener('input', function(e) {
            if (e.target.tagName === 'TEXTAREA') {
                e.target.style.height = 'auto';
                e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
            }
        });

        // --- Keyboard handlers (after DOM is built) ---
        document.addEventListener('keydown', function(e) {
            if (e.target.id === 'input-master' && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.sendMasterMessage();
            }
        });

        // --- Send button click handler ---
        document.addEventListener('click', function(e) {
            if (e.target.id === 'btn-send') window.sendMasterMessage();
        });

        // --- Start ---
        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
