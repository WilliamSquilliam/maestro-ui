<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro — Chat UI</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #58a6ff;
        }

        header span.subtitle {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .chat-container {
            display: flex;
            flex: 1;
            gap: 1px;
            background-color: #30363d;
            overflow: hidden;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0d1117;
            min-width: 0;
        }

        .chat-header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #c9d1d9;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #3fb950;
            display: inline-block;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background-color: #30363d;
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #1f6feb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.system {
            align-self: flex-start;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-bottom-left-radius: 4px;
        }

        .message .timestamp {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 4px;
            display: block;
        }

        .message.system .timestamp {
            color: #484f58;
        }

        .chat-input-area {
            border-top: 1px solid #30363d;
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            background-color: #161b22;
            flex-shrink: 0;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: #58a6ff;
        }

        .chat-input-area input[type="text"]::placeholder {
            color: #484f58;
        }

        .chat-input-area button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #238636;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .chat-input-area button:hover {
            background-color: #2ea043;
        }

        .chat-input-area button:active {
            background-color: #1a7f37;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #484f58;
            font-size: 0.9rem;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .chat-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Maestro</h1>
        <span class="subtitle">Multi-Agent Chat Interface</span>
    </header>

    <div class="chat-container">
        <!-- Chat Panel 1 -->
        <div class="chat-panel" id="panel-1">
            <div class="chat-header">
                <span class="dot"></span>
                Chat 1
            </div>
            <div class="chat-messages" id="messages-1">
                <div class="empty-state" id="empty-1">No messages yet. Start a conversation.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="input-1" placeholder="Type a message..." autocomplete="off">
                <button onclick="sendMessage(1)">Send</button>
            </div>
        </div>

        <!-- Chat Panel 2 -->
        <div class="chat-panel" id="panel-2">
            <div class="chat-header">
                <span class="dot"></span>
                Chat 2
            </div>
            <div class="chat-messages" id="messages-2">
                <div class="empty-state" id="empty-2">No messages yet. Start a conversation.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="input-2" placeholder="Type a message..." autocomplete="off">
                <button onclick="sendMessage(2)">Send</button>
            </div>
        </div>
    </div>

    <script>
        function getTimestamp() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function sendMessage(panelId) {
            const input = document.getElementById(`input-${panelId}`);
            const messagesContainer = document.getElementById(`messages-${panelId}`);
            const emptyState = document.getElementById(`empty-${panelId}`);
            const text = input.value.trim();

            if (!text) return;

            // Remove empty state if present
            if (emptyState) {
                emptyState.remove();
            }

            // Create user message
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'user');
            msgDiv.innerHTML = `${escapeHtml(text)}<span class="timestamp">${getTimestamp()}</span>`;
            messagesContainer.appendChild(msgDiv);

            // Clear input
            input.value = '';
            input.focus();

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Simulate a system echo response after a short delay
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.classList.add('message', 'system');
                replyDiv.innerHTML = `Echo: ${escapeHtml(text)}<span class="timestamp">${getTimestamp()}</span>`;
                messagesContainer.appendChild(replyDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 400);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow sending messages with Enter key
        document.getElementById('input-1').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage(1);
        });

        document.getElementById('input-2').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage(2);
        });
    </script>
</body>
</html>
